name: ai_college_companion
description: Offline-first academic planning and AI study companion.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: 6.8.0
  connectivity_plus: 7.3.1
  file_picker: 3.0.4
